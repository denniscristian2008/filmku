<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FilmKu - Temukan Film Favoritmu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            🎬 FilmKu
        </div>

        <button class="menu-button" onclick="toggleMenu()">
            ☰
        </button>

        <nav id="navigation">
            <a href="#home">Home</a>
            <a href="#film">Film</a>
            <a href="#populer">Populer</a>
        </nav>
    </header>


    <!-- HERO -->
    <section class="hero" id="home">

        <div class="hero-content">

            <p class="small-title">
                SELAMAT DATANG DI FILMKU
            </p>

            <h1>
                Temukan Film<br>
                Favoritmu
            </h1>

            <p class="hero-description">
                Cari film favoritmu dan lihat poster,
                genre, rating, serta sinopsisnya.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari judul film..."
                    onkeydown="handleSearch(event)"
                >

                <button onclick="searchMovies()">
                    🔍 Cari
                </button>
            </div>

        </div>

    </section>


    <!-- FILM -->
    <main id="film">

        <section class="movie-section">

            <div class="section-title">
                <h2>Film Populer</h2>

                <button onclick="loadPopularMovies()">
                    Refresh
                </button>
            </div>

            <div id="loading" class="loading">
                Memuat film...
            </div>

            <div id="movieContainer" class="movie-container">
                <!-- Film akan muncul otomatis di sini -->
            </div>

        </section>


        <!-- HASIL PENCARIAN -->
        <section class="movie-section search-result-section">

            <div class="section-title">
                <h2 id="searchTitle">
                    Hasil Pencarian
                </h2>
            </div>

            <div id="searchContainer" class="movie-container">
                <!-- Hasil pencarian muncul di sini -->
            </div>

        </section>

    </main>


    <!-- DETAIL FILM -->
    <div id="movieModal" class="modal">

        <div class="modal-content">

            <button
                class="close-button"
                onclick="closeMovieDetail()">
                ×
            </button>

            <div id="movieDetail">
                <!-- Detail film -->
            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 FilmKu
        </p>

        <p class="tmdb-notice">
            Data film disediakan oleh TMDB.
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
